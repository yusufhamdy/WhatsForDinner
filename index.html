<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's For Dinner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='24' fill='%23ff5c0a'/><g fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M17 12v8a3.5 3.5 0 0 0 7 0v-8M20.5 12v24'/><path d='M31 36V12c-3 2-4.5 5.5-4.5 9.5H31'/></g></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3v5a2.5 2.5 0 0 0 5 0V3M9.5 3v18"/>
            <path d="M17 21V3c-2.2 1.4-3.2 4-3.2 7H17"/>
          </svg>
        </div>
        <div>
          <h1>What's For Dinner</h1>
          <p>Your daily meal inspiration</p>
        </div>
      </div>
      <div class="actions">
        <button class="icon-btn" aria-label="Saved recipes" title="Saved Recipes">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
        </button>
        <button class="icon-btn" aria-label="Recent" title="Recent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3 9"/><path d="M3 4v5h5"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
        <button class="icon-btn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="currentColor"/><circle cx="12" cy="12" r="2.6" fill="#fff"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
        <img class="avatar" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg" alt="Profile" />
      </div>
    </div>
  </header>

  <main class="container">
    <article class="card" aria-live="polite">
      <div class="media">
        <div class="art" id="art"></div>
        <img id="photo" alt="" hidden />

        <div class="rating-pill">
          <svg viewBox="0 0 24 24"><path fill="#facc15" d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
          <strong id="rating"></strong>
          <span id="reviews"></span>
        </div>

        <div class="stats">
          <div class="stat">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff6a00"/><path d="M12 6v6l4 2" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <small>Prep Time</small><strong id="prep"></strong>
          </div>
          <div class="stat">
            <svg viewBox="0 0 24 24"><path d="M12 2c1 3 4 4.5 4 8a4 4 0 0 1-8 0c0-1.5.7-2.5 1.5-3.5.6 1.4 1.8 1.6 2-.5.1-1.4 0-2.6.5-4z" fill="#ef4444"/><path d="M3.5 15h17l-1.7 5.5H5.2z" fill="#ef4444"/></svg>
            <small>Cook Time</small><strong id="cook"></strong>
          </div>
          <div class="stat">
            <svg viewBox="0 0 24 24" fill="#3b82f6"><circle cx="8" cy="8" r="3.5"/><circle cx="17" cy="8.5" r="3"/><path d="M1.5 20c0-4 3-6.5 6.5-6.5s6.5 2.5 6.5 6.5z"/><path d="M15.6 13.8c3-.2 6.9 1.3 6.9 6.2h-6.2c0-2.4-.2-4.5-.7-6.2z"/></svg>
            <small>Servings</small><strong id="servings"></strong>
          </div>
        </div>
      </div>

      <div class="details">
        <div class="tags">
          <span class="tag" id="difficulty"></span>
          <span class="tag blue" id="cuisine"></span>
        </div>

        <div class="title-row">
          <h2 id="name"></h2>
          <div class="title-actions">
            <button class="soft-btn" id="bookmark" aria-label="Save recipe" title="Save recipe">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
            </button>
            <button class="soft-btn" id="share" aria-label="Share recipe" title="Share recipe">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="18" cy="5" r="3.2"/><circle cx="6" cy="12" r="3.2"/><circle cx="18" cy="19" r="3.2"/><path d="M8.5 10.6l7-4M8.5 13.4l7 4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            </button>
          </div>
        </div>
        <p class="desc" id="description"></p>

        <div class="alert" id="alert" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 2.5l10.5 18.5h-21z" fill="#dc2626"/><path d="M12 9v5.5M12 17.2v.1" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
          <div>
            <h4>Extended Preparation Time</h4>
            <p>This recipe requires more than 45 minutes to prepare. Plan accordingly!</p>
          </div>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="ingredients" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l1.6 1.6L7.5 3.7M3 12l1.6 1.6 2.9-2.9M3 19l1.6 1.6 2.9-2.9M11 5.5h10M11 12.5h10M11 19.5h10"/></svg>
            Ingredients
          </button>
          <button class="tab" role="tab" data-tab="instructions" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 6C10 4.4 6.5 4 3 4.6v14c3.5-.6 7 0 9 1.6 2-1.6 5.5-2.2 9-1.6v-14C17.5 4 14 4.4 12 6z"/><path d="M12 6.5v13" stroke="#fff" stroke-width="1.6"/></svg>
            Instructions
          </button>
          <button class="tab" role="tab" data-tab="nutrition" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 3.2a9 9 0 1 0 10.3 10.3H10.5z"/><path d="M13 2.2a9 9 0 0 1 8.8 8.8H13z"/></svg>
            Nutrition
          </button>
          <button class="tab" role="tab" data-tab="tips" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 2z"/><rect x="9.5" y="17.4" width="5" height="2" rx="1"/><rect x="10.5" y="20.4" width="3" height="1.6" rx=".8"/></svg>
            Chef's Tips
          </button>
        </div>

        <div class="panel" id="panel"></div>
      </div>
    </article>

    <div class="again">
      <button class="primary" id="new-recipe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Try Another Recipe
      </button>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
